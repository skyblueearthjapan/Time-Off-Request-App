# 休暇届アプリ VPS 版の web（nginx）。
# 公式 nginx イメージの /etc/nginx/conf.d/default.conf に置く想定（http{} の中に読み込まれる）。
# - /static/ だけ nginx が web/static から返す（compose で /usr/share/nginx/html/static に置く）
# - /（画面。?page=）・/api/（RPC）・/auth/・/healthz は api コンテナ（FastAPI, :8000）へ中継
# - 入口は Cloudflare Tunnel（cloudflared → http://web:80）。TLS は Cloudflare で終わる。

map $http_x_forwarded_proto $kyuka_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 利用者の IP。入口は Cloudflare Tunnel だけ（ホストにポートを出さない）なので、Cloudflare が付ける
# CF-Connecting-IP を使う（無いとき＝コンテナの中からの確認は、つないできた相手の IP）。
map $http_cf_connecting_ip $kyuka_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

log_format kyuka '$kyuka_client_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';

# /api/ の回数制限。社内は同じ IP（会社の出口）からの利用が多いので緩め（1 秒 10 回、バースト 30）。
limit_req_zone $kyuka_client_ip zone=kyuka_api:10m rate=10r/s;
# ログイン（/auth/）も緩く制限する（1 秒 5 回、バースト 20。セキュリティ 低-3）
limit_req_zone $kyuka_client_ip zone=kyuka_auth:10m rate=5r/s;
# 画面（/）と /healthz も制限する。画面は 1 ページで JS・RPC が続くので /api/ と同じくらい緩め、
# /healthz は外からの確かめ（切り替えのときの env の確認）と web 自身の healthcheck（15 秒ごと）だけなので狭め。
limit_req_zone $kyuka_client_ip zone=kyuka_page:10m rate=10r/s;
limit_req_zone $kyuka_client_ip zone=kyuka_health:10m rate=2r/s;
limit_req_status 429;

upstream kyuka_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/access.log kyuka;

    # 本文は RPC の JSON だけ。手書きサインの PNG（base64）を 1 次承認の RPC で送るので 4m（仕様書 3-7。
    # api は api_approveLeaveRequest を 3 MB、ほかを 256 KB で 413 にする）。
    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- セキュリティヘッダ（server レベルに 1 回だけ） ----
    # location の中で add_header を使うと、ここの add_header が引き継がれなくなる（nginx の仕様）。
    # そのため location の中では add_header を使わず、キャッシュは expires で指定する。
    # - script-src 'self': 画面の JS は /static/js/*.js だけ。インラインの script・on 属性は使わない（3-6 の案 1）。
    # - style-src 'unsafe-inline': 今の画面の style 属性と <style> をそのまま使うため（書き換えない）。
    # - frame-ancestors 'self': ほかのサイトへの埋め込みを許さない（Q10 の既定。ポータルが iframe で
    #   埋め込んでいれば、この 1 行を変える）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 画面の JS・CSS（nginx が返す） ----
    location /static/ {
        # 画面を直したらすぐ届くよう、毎回確かめさせる。
        expires -1;
        try_files $uri =404;
    }

    # ---- サーバー（FastAPI）へ中継 ----
    location /api/ {
        # /api/rpc/*（画面の呼び出しだけ）
        limit_req zone=kyuka_api burst=30 nodelay;
        proxy_pass http://kyuka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kyuka_client_ip;
        proxy_set_header X-Forwarded-For $kyuka_client_ip;
        proxy_set_header X-Forwarded-Proto $kyuka_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
    # OAuth の code・state を URL ごとアクセスログに残さない（セキュリティ 低-12）
    location = /auth/callback {
        access_log off;
        limit_req zone=kyuka_auth burst=20 nodelay;
        proxy_pass http://kyuka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kyuka_client_ip;
        proxy_set_header X-Forwarded-For $kyuka_client_ip;
        proxy_set_header X-Forwarded-Proto $kyuka_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
    # 委任（DELEGATE_EMAIL）の OAuth の戻り先も、code・state をアクセスログに残さない
    location = /auth/google-delegate/callback {
        access_log off;
        limit_req zone=kyuka_auth burst=20 nodelay;
        proxy_pass http://kyuka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kyuka_client_ip;
        proxy_set_header X-Forwarded-For $kyuka_client_ip;
        proxy_set_header X-Forwarded-Proto $kyuka_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
    location /auth/ {
        limit_req zone=kyuka_auth burst=20 nodelay;
        proxy_pass http://kyuka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kyuka_client_ip;
        proxy_set_header X-Forwarded-For $kyuka_client_ip;
        proxy_set_header X-Forwarded-Proto $kyuka_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
    # 外への /healthz は {"ok":true,"env":"staging"|"production"} のまま返す（詳細は運用者のログインが要る）。
    # 切り替えのときに、入口がどちらの環境につながっているかを env で確かめるため（env は秘密ではない）。
    location = /healthz {
        limit_req zone=kyuka_health burst=10 nodelay;
        proxy_pass http://kyuka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kyuka_client_ip;
        proxy_set_header X-Forwarded-For $kyuka_client_ip;
        proxy_set_header X-Forwarded-Proto $kyuka_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # ---- 画面（/?page=top など。api の app/pages.py が返す） ----
    location / {
        limit_req zone=kyuka_page burst=30 nodelay;
        expires -1;
        proxy_pass http://kyuka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $kyuka_client_ip;
        proxy_set_header X-Forwarded-For $kyuka_client_ip;
        proxy_set_header X-Forwarded-Proto $kyuka_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
