{% if SHOW_OPS %}
    <!-- 運用（管理者）: VPS 版で足した欄（仕様 3-11）。運用者のときだけ出す。閉じたままなら今の画面と同じ見た目 -->
    <details class="card" id="opsPanel">
      <summary style="cursor:pointer; font-weight:900;">運用（管理者）</summary>
      <div class="row" style="margin-top:12px;">
        <button class="btn-sm ghost" data-on-click="opsLoadStatus">状態を更新</button>
        <button class="btn-sm ghost" data-on-click="opsRun" data-args='["ops_syncSheetConfigNow","$this"]'>設定タブを今すぐ取り込む</button>
        <button class="btn-sm ghost" data-on-click="opsRun" data-args='["ops_runMasterSync","$this"]'>マスタ同期</button>
        <button class="btn-sm ghost" data-on-click="opsRun" data-args='["ops_rebuildSummaryNow","$this"]'>集計タブを今すぐ書き直す</button>
        <button class="btn-sm ghost" data-on-click="opsRun" data-args='["ops_sendWarnMail","$this"]'>有給警告メールを送る</button>
        <a href="/auth/google-delegate/start" target="_top" class="nav-link">委任の許可をやり直す</a>
      </div>
      <div class="row" style="margin-top:10px;">
        <div>
          <div class="sub">メール</div>
          <input id="opsRevokeEmail" placeholder="name@lineworks-local.info">
        </div>
        <button class="btn-sm ghost" data-on-click="opsRunWithInput" data-args='["ops_revokeSessions","opsRevokeEmail","$this"]'>セッションの取り消し</button>
      </div>
      <div id="opsFailed" style="margin-top:12px;"></div>
      <pre id="opsStatus" style="margin-top:12px; white-space:pre-wrap; word-break:break-all; font-size:12px; background:#f7fbff; border:1px solid var(--line); border-radius:12px; padding:10px; max-height:420px; overflow:auto;">（開くと読み込みます）</pre>
    </details>
{% endif %}
